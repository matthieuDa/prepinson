[build]
  command = "INSTAGRAM_SNAPSHOT_MODE=skip python3 scripts/build_design_previews.py"
  publish = "dist"

[[edge_functions]]
  function = "language-redirect"
  path = "/"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[functions."refresh-instagram"]
  schedule = "17 */12 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.deploy-preview]
  command = "INSTAGRAM_SNAPSHOT_MODE=skip python3 scripts/build_design_previews.py"

[context.deploy-preview.environment]
  PREVIEW_MODE = "true"
